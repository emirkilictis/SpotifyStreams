name: Spotify Stream Scrape

on:
  # Tetikleme harici scheduler'dan (cron-job.org) workflow_dispatch ile geliyor.
  # GitHub'in kendi schedule cron'u guvenilmez (job'lari dusuruyor), o yuzden kaldirildi.
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a full scrape + dedup even if today is already captured'
        type: boolean
        default: false
      artists:
        description: 'Comma-separated artist IDs to scrape (empty = full roster). Used by the admin panel per-artist sync.'
        type: string
        default: ''

# Saatlik cron-job.org tetiklemeleri gercek bir tarama (yeni gun / yeni sanatci)
# 20-30 dk surdugunde cakisabiliyor. Tek bir kuyruk: bir run devam ederken yeni
# tetikleme IPTAL ETMEZ, sira bekler (cancel-in-progress: false) — boylece iki
# run ayni anda DB'ye yazip birbirini ezmez.
concurrency:
  group: spotify-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape JT Stream Counts
    runs-on: ubuntu-latest
    # Yogun gunler (yeni sanatci backfill + appears-on) uzun surebiliyor. Scraper
    # artik kendi SCRAPE_BUDGET_MS (varsayilan 35 dk) butcesiyle yeni sanatci
    # baslatmayi birakip temiz cikiyor (dedup + exit 0); kalanlar bir sonraki
    # saatlik run'da resume ile tamamlaniyor. Bu cap sadece guvenlik agi — butce +
    # ucan sanatci + dedup'a pay birakacak sekilde 50'ye cikarildi.
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/spotify-scraper/package.json

      - name: Install dependencies
        working-directory: services/spotify-scraper
        run: npm ci

      - name: Run scraper
        working-directory: services/spotify-scraper
        env:
          SP_DC:        ${{ secrets.SP_DC }}
          SP_KEY:       ${{ secrets.SP_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_SCRAPE: ${{ inputs.force }}
          SCRAPE_ARTISTS: ${{ inputs.artists }}
        run: |
          ARGS=""
          if [ -n "$SCRAPE_ARTISTS" ]; then ARGS="--artists=$SCRAPE_ARTISTS"; fi
          echo "Running: node scraper.js $ARGS (force=$FORCE_SCRAPE)"
          node scraper.js $ARGS

      # Self-healing kworb reconciliation. A newly added artist virtually always
      # sits below their kworb page — a co-tracked collab lands in the OTHER
      # artist's bucket, and a guest feature whose lead we don't track never
      # shows up in appears-on so it is never scraped at all. Both used to need a
      # manual audit + a code edit; this step now finds and repairs them from
      # data (kworb is only a discovery hint — every number still comes from
      # Spotify, and nothing is pinned unless Spotify credits the artist).
      #
      # It self-paces: never-checked artists first (i.e. the one you just added),
      # then a ~20h per-artist cooldown, a few artists per run, and its own time
      # budget — so the hourly trigger amortises the whole roster over a day
      # without ever threatening the scrape job's timeout. Non-fatal by design:
      # a kworb outage must never fail the run that already captured the data.
      - name: Reconcile against kworb
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        working-directory: services/spotify-scraper
        env:
          SP_DC:        ${{ secrets.SP_DC }}
          SP_KEY:       ${{ secrets.SP_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPE_ARTISTS: ${{ inputs.artists }}
        run: |
          ARGS=""
          if [ -n "$SCRAPE_ARTISTS" ]; then ARGS="--artists=$SCRAPE_ARTISTS --force"; fi
          node reconcile-kworb.js $ARGS

      # Bayat playcount onarimi. Scraper playcount'u ALBUM sayfasindan okuyor ve
      # bazi sarkilarda o sayfa gunlerce guncellenmiyor: JT'nin "Holy Grail"i
      # sekiz gun 406.032.077'de dondu, sarkinin kendi sayfasi 406.368.183
      # diyorken. Veri yanlis degil, eski — ve donmus bir sarki sanatcinin
      # gunluk toplamindan sessizce eksiliyor.
      #
      # Bu adim gunlerdir kipirdamayan sarkilari canli okuyup gercek degerine
      # cekiyor. Sadece YUKARI yazar; dususler teyit isteyen ayri mekanizmanin
      # isi. Tarayici actigi icin her turda az sayida sarkiya bakar, birkac
      # turda hepsini dolasir.
      - name: Repair stale playcounts
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        working-directory: services/spotify-scraper
        env:
          SP_DC:        ${{ secrets.SP_DC }}
          SP_KEY:       ${{ secrets.SP_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node repair-stale-playcounts.js --limit=12 --apply

      # Saatlik dedup. Dedup normalde sadece GERCEK tarama yapan run'in sonunda
      # calisiyor, yani gunde bir; arada ortaya cikan kopyalar (yeni kesfedilen
      # bir derleme edition'i, Spotify'in bir kaydi baskasina baglamasi) ertesi
      # gune kadar duruyor ve o sure boyunca toplamlar sisik gorunuyor.
      #
      # Bu adim vaktiyle Neon yuzunden kaldirilmisti: her calisma compute'u
      # uyandiriyor, fatura da uyanik kalma suresine gore kesiliyordu. Supabase
      # oyle bir sey faturalamiyor, o yuzden geri geldi.
      #
      # Ardindan audit-duplicate-heads: dedup'in goremedigi iki deseni (ayni
      # kaydi tasiyan ikiz baslar, yanlis gruba baglanmis uye) tarar ve yalnizca
      # kaniti kesin olanlari — ayni gunde birebir ayni playcount, 3+ gun —
      # manual_merges kurali olarak birlestirir. Geri kalani rapora yazar.
      - name: Deduplicate + audit
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node run-dedup.js
          node audit-duplicate-heads.js --apply

      # JT'nin aylik dinleyici sayisini gunde bir tweetler. Veriyi Spotify'dan
      # degil bu run'in DB'ye yazdigi satirdan okur, yani tweet her zaman
      # sitedeki rakamla ayni olur. tweet_log defteri sayesinde idempotent:
      # saatlik tetiklemelerin tamami cagirsa da gun basina tek tweet cikar.
      #
      # Supheye dusunce SUSAR: gunun satiri yoksa, o gun icin zaten atildiysa,
      # ya da degisim %10'u asiyorsa (aylik dinleyici gunde ~%0.1 oynar, %10 =
      # veri kazasi) hicbir sey gondermez. Sahibi yokken calisiyor ve yanlis
      # rakami geri almak hic atmamaktan pahali.
      #
      # X anahtarlari yoksa sessizce atlanir; hicbir kosulda run'i dusurmez.
      - name: Tweet monthly listeners
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          X_CONSUMER_KEY:    ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN:    ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:   ${{ secrets.X_ACCESS_SECRET }}
          # Tweet'in sonuna eklenen serbest not. Repository variable, secret
          # degil: gecici duyurular icin (ornegin tatil) GitHub'dan yazilir,
          # ise yaramaz olunca silinir. Bos birakilirsa hicbir sey eklenmez.
          TWEET_FOOTER:      ${{ vars.TWEET_FOOTER }}
        run: node tweet-monthly-listeners.js

      # JT'nin gunluk stream'i esigi (varsayilan 9M) asarsa gunun ozeti + en cok
      # akan 5 sarki. Rakamlar siteden okunur, DB'den degil: atif kurali basit
      # bir primary_artist filtresi degil ve elle hesaplanan sayi sayfadakiyle
      # tutmuyor. JT'nin sarkilarinin %90'i o gune yazilmadan bakilmaz —
      # tarama surerken gunluk rakam oturana kadar oynuyor (9.8M → 9.4M), yarim
      # bir gunle atilan tweet birkac dakika sonra yanlisa donebilir.
      - name: Tweet daily recap
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          DASHBOARD_URL:     ${{ vars.DASHBOARD_URL || 'https://spotify-streams-dashboard.onrender.com' }}
          X_CONSUMER_KEY:    ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN:    ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:   ${{ secrets.X_ACCESS_SECRET }}
          TWEET_FOOTER:      ${{ vars.TWEET_FOOTER }}
        run: node tweet-daily-recap.js

      # Yeni gunun sayilari yakalandiysa takipcilere web push gonder. Endpoint
      # idempotent (push_sent_days ledger'i) — her saat cagrilmasi zararsiz,
      # sadece HENUZ duyurulmamis bir gun varsa bildirim cikar. Sanatcinin
      # sarkilarinin %90'i o gune yazilmadan da duyurmaz, yani yarim kalan bir
      # run gunun toplamini eksik bildirmez.
      #
      # Hicbir sekilde run'i dusurmez: veri zaten yazildi, bildirim sadece bir
      # ikram — ve bir sonraki saatlik run zaten tekrar dener.
      - name: Notify followers (web push)
        if: always()
        continue-on-error: true
        env:
          DISPATCH_SECRET: ${{ secrets.PUSH_DISPATCH_SECRET }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://spotify-streams-dashboard.onrender.com' }}
        run: |
          if [ -z "$DISPATCH_SECRET" ]; then
            echo "PUSH_DISPATCH_SECRET yok — bildirim adimi atlandi."
            exit 0
          fi
          curl -sS -m 120 -X POST "$DASHBOARD_URL/api/push/dispatch" \
            -H "x-dispatch-secret: $DISPATCH_SECRET" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}\n" || echo "dispatch cagrisi basarisiz (yok sayildi)"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Scraper başarısız oldu! Loglara bak: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

