name: Spotify Stream Scrape

on:
  # An external scheduler and the admin panel use workflow_dispatch.
  workflow_dispatch:
    inputs:
      force:
        description: 'Force collection and duplicate reconciliation even if today is already captured'
        type: boolean
        default: false
      artists:
        description: 'Comma-separated artist IDs; leave empty for the full roster. Used by admin artist sync.'
        type: string
        default: ''

# Keep active runs; separate targeted requests from the full-roster queue.
concurrency:
  group: spotify-scrape-${{ inputs.artists && 'manual' || 'auto' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: Collect Spotify data
    runs-on: ubuntu-latest
    env:
      DB_SSL_CA: ${{ secrets.DB_SSL_CA }}
    # Allow time for collection and the separately bounded maintenance steps.
    timeout-minutes: 100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/spotify-scraper/package-lock.json

      - name: Install dependencies
        working-directory: services/spotify-scraper
        run: npm ci

      - name: Run scraper
        id: scraper
        working-directory: services/spotify-scraper
        timeout-minutes: 55
        env:
          SP_DC:        ${{ secrets.SP_DC }}
          SP_KEY:       ${{ secrets.SP_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_SCRAPE: ${{ inputs.force }}
          SCRAPE_ARTISTS: ${{ inputs.artists }}
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "$SCRAPE_ARTISTS" ]; then ARGS="--artists=$SCRAPE_ARTISTS"; fi
          echo "Running: node scraper.js $ARGS (force=$FORCE_SCRAPE)"
          SCRAPER_LOG=$(mktemp)
          node scraper.js $ARGS | tee "$SCRAPER_LOG"
          if grep -q '^\[scraper\] OUTCOME=updated$' "$SCRAPER_LOG"; then
            echo "did_update=true" >> "$GITHUB_OUTPUT"
            echo "New Spotify data processed; maintenance steps will run."
          else
            echo "did_update=false" >> "$GITHUB_OUTPUT"
            echo "No new data; expensive maintenance steps will be skipped."
          fi

      # Use kworb for discovery hints; verify credits and counts with Spotify.
      # Per-artist cooldowns and a time budget keep this optional work bounded.
      - name: Reconcile against kworb
        if: steps.scraper.outputs.did_update == 'true'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: services/spotify-scraper
        env:
          SP_DC:        ${{ secrets.SP_DC }}
          SP_KEY:       ${{ secrets.SP_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPE_ARTISTS: ${{ inputs.artists }}
        run: |
          ARGS=""
          if [ -n "$SCRAPE_ARTISTS" ]; then ARGS="--artists=$SCRAPE_ARTISTS --force"; fi
          node reconcile-kworb.js $ARGS

      # Read track pages to repair stale album-page counts. Only increases
      # are applied; stream drops use a separate verification path.
      - name: Repair stale playcounts
        if: steps.scraper.outputs.did_update == 'true'
        continue-on-error: true
        timeout-minutes: 12
        working-directory: services/spotify-scraper
        env:
          SP_DC:        ${{ secrets.SP_DC }}
          SP_KEY:       ${{ secrets.SP_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node repair-stale-playcounts.js --limit=30 --min=100000 --apply

      # Run only after new data to avoid unnecessary catalogue and cache rebuilds.
      # The audit adds merge rules only when repeated exact counts support them.
      - name: Deduplicate and audit
        if: steps.scraper.outputs.did_update == 'true'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node run-dedup.js
          node audit-duplicate-heads.js --apply

      # The posting ledger permits at most one post per day. Missing credentials,
      # incomplete data, decreases, or implausible changes suppress publication.
      # Run after any successful scrape so a later run can retry a missed post.
      - name: Post monthly listeners to X
        if: steps.scraper.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          X_CONSUMER_KEY:    ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN:    ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:   ${{ secrets.X_ACCESS_SECRET }}
          # Optional public note configured as a repository variable.
          TWEET_FOOTER:      ${{ vars.TWEET_FOOTER }}
        run: node tweet-monthly-listeners.js

      # Publish only when the daily threshold and data completeness checks pass.
      # Read dashboard attribution and use the ledger to prevent duplicate posts.
      - name: Post daily recap to X
        if: steps.scraper.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          DASHBOARD_URL:     ${{ vars.DASHBOARD_URL || 'https://spotify-streams-dashboard.onrender.com' }}
          X_CONSUMER_KEY:    ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN:    ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:   ${{ secrets.X_ACCESS_SECRET }}
          # Optional public note configured as a repository variable.
          TWEET_FOOTER:      ${{ vars.TWEET_FOOTER }}
        run: node tweet-daily-recap.js

      # Notify only for complete, previously unannounced artist days.
      # Notification failure must not invalidate a successful data collection run.
      - name: Notify followers with web push
        if: steps.scraper.outputs.did_update == 'true'
        continue-on-error: true
        env:
          DISPATCH_SECRET: ${{ secrets.PUSH_DISPATCH_SECRET }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://spotify-streams-dashboard.onrender.com' }}
        run: |
          if [ -z "$DISPATCH_SECRET" ]; then
            echo "PUSH_DISPATCH_SECRET is missing; notification step skipped."
            exit 0
          fi
          curl -sS -m 120 -X POST "$DASHBOARD_URL/api/push/dispatch" \
            -H "x-dispatch-secret: $DISPATCH_SECRET" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}\n" || echo "Dispatch request failed (ignored)"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Scraper failed. View the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
