# Diagnostic checks are read-only except for the explicitly gated one-off repair.
name: Diagnose

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
    inputs:
      artist:
        description: 'Artist ID or part of an artist name'
        type: string
        default: 'Cardi'

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect artist daily statistics
    runs-on: ubuntu-latest
    env:
      DB_SSL_CA: ${{ secrets.DB_SSL_CA }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/spotify-scraper/package-lock.json
      - name: Install dependencies
        working-directory: services/spotify-scraper
        run: npm ci
      - name: Diagnose
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Pass user input through the environment, not shell interpolation.
          ARTIST: ${{ inputs.artist || 'Cardi' }}
        run: node diagnose-artist-daily.js --artist="$ARTIST" --days=14 --top=30

      # Inspect stored grouping and merge rules, with optional live Spotify values.
      - name: Inspect songs with missing daily gains
        continue-on-error: true
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SP_DC: ${{ secrets.SP_DC }}
        run: |
          node inspect-title.js --history=12 --live 'give it to me'

      # Disabled by default: live reads can consume the diagnostic time budget.
      - name: Audit JT stored values against live Spotify
        if: false
        continue-on-error: true
        timeout-minutes: 3
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SP_DC: ${{ secrets.SP_DC }}
        run: node audit-live-vs-stored.js --artist=31TPClRtHm23RisEBtV3X7 --top=60

      # Preview stream-drop reconciliation without applying changes.
      - name: Preview stream-drop reconciliation
        continue-on-error: true
        timeout-minutes: 5
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SP_DC: ${{ secrets.SP_DC }}
        run: node verify-drop-candidates.js

      # This write operation runs only with the [repair-stale] commit marker.
      - name: Restore stale playcounts (one-off)
        if: contains(github.event.head_commit.message, '[repair-stale]')
        timeout-minutes: 6
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SP_DC: ${{ secrets.SP_DC }}
        run: node repair-stale-playcounts.js --apply --days=3 --limit=40 --min=1000000 --artist=31TPClRtHm23RisEBtV3X7

      - name: Inspect the sources of JT daily gains
        continue-on-error: true
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node audit-catchup.js --artist=31TPClRtHm23RisEBtV3X7

      # Use the same SQL helper as the dashboard against the configured database.
      - name: Check the served headline query
        working-directory: services/web-dashboard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install --no-audit --no-fund
          echo "--- Cardi B"
          node scripts/check-stats-sql.js 4kYSro6naA4h99UJvo89HB
          echo "--- Justin Timberlake"
          node scripts/check-stats-sql.js 31TPClRtHm23RisEBtV3X7 'give it to me'

      # Separate database query time from Render cold-start and HTTP latency.
      - name: Measure database and dashboard latency
        continue-on-error: true
        timeout-minutes: 5
        working-directory: services/web-dashboard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install --no-audit --no-fund
          echo "--- database"
          node scripts/bench-agg.js
          echo "--- live site (Render): the first request may include a cold start"
          for i in 1 2 3; do
            curl -s -o /dev/null -w "  attempt $i: connect %{time_connect}s  first byte %{time_starttransfer}s  total %{time_total}s  status %{http_code}\n" \
              --max-time 90 https://spotify-streams-dashboard.onrender.com/health || echo "  attempt $i: unreachable"
          done
