name: Diagnose

# Read-only tesbit kosusu. Hicbir sey yazmaz — sadece SELECT calistirip raporu
# log'a basar. Gelistirme dallarina push'ta calisir cunku workflow_dispatch
# yalnizca default branch'ten tetiklenebiliyor ve tesbit genelde dal ustunde
# yaziliyor.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
    inputs:
      artist:
        description: 'Artist id or name fragment'
        type: string
        default: 'Cardi'

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose artist daily
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/spotify-scraper/package.json
      - name: Install dependencies
        working-directory: services/spotify-scraper
        run: npm ci
      - name: Diagnose
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Girdiyi komut satirina interpolate etme — env uzerinden gecir.
          ARTIST: ${{ inputs.artist || 'Cardi' }}
        run: node diagnose-artist-daily.js --artist="$ARTIST" --days=14 --top=30

      # Dashboard'un servis ettigi headline sorgusunun ta kendisini gercek DB'ye
      # karsi calistirir. lib/agg-sql.js'i require ettigi icin burada gecen SQL
      # ile sayfada calisan SQL ayni metin.
      - name: Check the served headline query
        working-directory: services/web-dashboard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install --no-audit --no-fund
          echo "--- Cardi B"
          node scripts/check-stats-sql.js 4kYSro6naA4h99UJvo89HB
          echo "--- Justin Timberlake"
          node scripts/check-stats-sql.js 31TPClRtHm23RisEBtV3X7

      # Supheli degerin gercegini Spotify'a sor. Ayni adim fetchTrackPlaycount'u
      # da gercek Spotify'a karsi calistiriyor — bayat-onarim yolunun yeni okuma
      # kaynagi bu, ve "Not a Bad Thing - Radio Edit" tam da album sayfasindan
      # okunamayan sarkiydi.
      - name: Ask Spotify what the suspect values really are
        continue-on-error: true
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SP_DC: ${{ secrets.SP_DC }}
        run: |
          node read-live-playcount.js 0i1bokCJ95evU1gb5HcXFy
          node read-live-playcount.js --title='Not a Bad Thing'

      # TEK SEFERLIK YAZMA. Yalnizca commit mesajinda [repair-drop] gecerse
      # calisir, yani kazara her push'ta tetiklenmez. Once dry-run basar, sonra
      # uygular. Isi bitince bu adim kaldirilacak.
      - name: Repair the phantom on Never Lose Me
        if: contains(github.event.head_commit.message, '[repair-drop]')
        working-directory: services/spotify-scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SP_DC: ${{ secrets.SP_DC }}
        run: |
          echo "--- dry-run"
          node repair-stream-drops.js 0i1bokCJ95evU1gb5HcXFy
          echo "--- apply"
          node repair-stream-drops.js --apply --force 0i1bokCJ95evU1gb5HcXFy
          echo "--- after"
          node read-live-playcount.js 0i1bokCJ95evU1gb5HcXFy
          node diagnose-artist-daily.js --artist=Cardi --days=8 --top=5
