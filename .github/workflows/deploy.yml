# Trigger Render through its deploy hook on pushes to main or manual dispatch.
# Set RENDER_DEPLOY_HOOK in GitHub Actions repository secrets using the URL
# from Render > Service > Settings > Deploy Hook. Without the secret, this
# workflow skips deployment. Keep the hook URL out of logs.
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded deployment jobs when a newer push arrives.
concurrency:
  group: render-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is missing; refusing to report a false-green deployment."
            echo "Add the Render deploy hook as a GitHub Actions repository secret."
            exit 1
          fi
          # Log only the response status; the deploy hook URL is a secret.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          echo "Render deploy hook -> HTTP $code"
          # Treat non-2xx responses as failures.
          case "$code" in
            2*) echo "Deployment triggered." ;;
            *)  echo "Deployment could not be triggered (HTTP $code)."; exit 1 ;;
          esac

      - name: Verify the deployed version
        if: success()
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected="${EXPECTED_COMMIT:0:7}"
          for attempt in {1..18}; do
            payload=$(curl -fsS --max-time 15 https://spotify-streams-dashboard.onrender.com/healthz || true)
            commit=$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' 2>/dev/null || true)
            echo "Health check attempt $attempt: commit=${commit:-unavailable}"
            if [ "$commit" = "$expected" ]; then
              echo "Production is serving commit $expected."
              exit 0
            fi
            sleep 10
          done
          echo "Production did not report commit $expected within the verification window."
          exit 1
