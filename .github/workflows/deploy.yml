# Trigger Render through its deploy hook on pushes to main or manual dispatch.
# Set RENDER_DEPLOY_HOOK in GitHub Actions repository secrets using the URL
# from Render > Service > Settings > Deploy Hook. Without the secret, this
# workflow skips deployment. Keep the hook URL out of logs.
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded deployment jobs when a newer push arrives.
concurrency:
  group: render-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is missing; deployment skipped."
            echo "See the setup instructions at the top of this workflow."
            exit 0
          fi
          # Log only the response status; the deploy hook URL is a secret.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          echo "Render deploy hook -> HTTP $code"
          # Treat non-2xx responses as failures.
          case "$code" in
            2*) echo "Deployment triggered." ;;
            *)  echo "Deployment could not be triggered (HTTP $code)."; exit 1 ;;
          esac

      - name: Verify the deployed version
        if: success()
        run: |
          echo "Check the version running in production:"
          echo "  curl -s https://spotify-streams-dashboard.onrender.com/healthz"
          echo "Compare the returned commit field with this push SHA: ${GITHUB_SHA:0:7}"
