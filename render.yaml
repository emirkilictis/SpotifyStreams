services:
  - type: web
    name: spotify-streams-dashboard
    env: node
    plan: free
    rootDir: services/web-dashboard
    buildCommand: npm ci
    startCommand: node server.js
    # Deploy on pushes to main for Blueprint-managed services.
    # Manually created services use their own Render dashboard settings.
    # Check /healthz -> commit to identify the deployed revision.
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Supabase session pooler URI — port 5432, NOT the 6543
        # transaction pooler. TLS certificate and hostname verification are required.
        # Legacy URL SSL flags are stripped by the shared connection policy.
      - key: ADMIN_PASSCODE
        generateValue: true
      - key: SECADMIN_PASSCODE
        generateValue: true
      - key: IP_HASH_SECRET
        generateValue: true
      - key: JC_PASSCODES
        sync: false
      - key: DB_SSL_MODE
        value: verify-full
      # If required, add DB_SSL_CA (PEM) or DB_SSL_CA_FILE (secret file path)
      # using the CA downloaded from your database provider's dashboard.
      - key: TRUST_PROXY_HOPS
        value: 1
      # Web push. Without these the notification feature reports itself
      # unavailable and the bell never appears — the site runs exactly as it did
      # before it existed. Generate a pair with `npx web-push generate-vapid-keys`.
      # Use the same pair in environments sharing subscriptions; replacing it
      # requires existing subscribers to subscribe again.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # mailto: address push services can contact you on
      # Shared secret the scrape workflow presents to /api/push/dispatch. Must
      # match the PUSH_DISPATCH_SECRET repository secret on GitHub.
      - key: PUSH_DISPATCH_SECRET
        sync: false
