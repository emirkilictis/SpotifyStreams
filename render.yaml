services:
  - type: web
    name: spotify-streams-dashboard
    env: node
    plan: free
    rootDir: services/web-dashboard
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Supabase session pooler URI — port 5432, NOT the 6543
        # transaction pooler (pg uses prepared statements), and it MUST end in
        # ?sslmode=no-verify: the pooler certificate is self-signed, and plain
        # "require" is treated as verify-full, which fails every query.
      # Web push. Without these the notification feature reports itself
      # unavailable and the bell never appears — the site runs exactly as it did
      # before it existed. Generate a pair with `npx web-push generate-vapid-keys`
      # (a pair already sits in the repo-root .env) and paste the SAME values
      # here: subscriptions are bound to the public key, so changing it later
      # silently breaks everyone who already subscribed.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # mailto: address push services can contact you on
      # Shared secret the scrape workflow presents to /api/push/dispatch. Must
      # match the PUSH_DISPATCH_SECRET repository secret on GitHub.
      - key: PUSH_DISPATCH_SECRET
        sync: false
